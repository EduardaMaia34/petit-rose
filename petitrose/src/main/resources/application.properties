spring.application.name=petitrose

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/petitrose_db
spring.datasource.username=admin
spring.datasource.password=confeitaria
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate/JPA para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Docker Compose Integration
spring.docker.compose.lifecycle-management=start-and-stop

# Pasta onde as imagens serão salvas (relativo à raiz do projeto)
file.upload-dir=uploads/images

# Limite de tamanho de arquivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuração de Segurança JWT
api.security.token.secret=petitrose