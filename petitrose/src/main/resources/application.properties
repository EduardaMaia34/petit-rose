spring.application.name=petitrose

spring.datasource.url=jdbc:mysql://localhost:3307/petitrose?useSSL=false&serverTimezone=UTC

# 2. CORREÇÃO: Usar o Driver do MySQL (não o do PostgreSQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Credenciais
spring.datasource.username=root
# Se houver senha no seu MySQL, coloque-a abaixo. Se não houver, deixe vazio.
spring.datasource.password=

# 4. Configurações adicionais recomendadas para Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave secreta para geração do Token JWT
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-petit-rose-123}

server.port=8081