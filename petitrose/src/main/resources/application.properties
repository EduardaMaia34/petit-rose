spring.application.name=petitrose

# Configurações do Banco de Dados Local (PostgreSQL instalado no Linux)
spring.datasource.url=jdbc:postgresql://localhost:5432/petitrose_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DESATIVAR INTEGRACAO DOCKER COMPOSE
# Isso impede que o Spring tente procurar o arquivo compose.yaml ou subir containers
spring.docker.compose.enabled=false

# Chave secreta para geração do Token JWT (Pode ser qualquer frase)
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-petit-rose-123}