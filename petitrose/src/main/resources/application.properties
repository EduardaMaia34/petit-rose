
# Desativa o Docker Compose (caso ainda tenha deixado a dependência no pom.xml)
spring.docker.compose.enabled=false

# Configurações do MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/petitrose?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
server.port=8081
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate/JPA para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Configuração da chave secreta para a segurança (JWT)
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-e-super-segura-petit-rose-2026}