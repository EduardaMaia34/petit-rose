version: "3.8"

services:
  db:
    image: postgres:alpine
    container_name: petitrose-db
    environment:
      - POSTGRES_DB=petitrose_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=confeitaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - petitrose-network

  backend:
    build: ./petitrose
    container_name: petitrose-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - JWT_SECRET=petitrose-secret-key-123
    networks:
      - petitrose-network

  frontend:
    build: ./frontend
    container_name: petitrose-web
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - petitrose-network

volumes:
  postgres_data:

networks:
  petitrose-network: